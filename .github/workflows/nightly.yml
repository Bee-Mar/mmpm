name: Nightly MagicMirror Package Download Check

on:
  schedule:
    - cron: "0 0 * * *" # midnight, every night

jobs:
  test_package_download:
    runs-on: ubuntu-latest
    container: karsten13/mmpm:latest
    steps:
      - run: |
          mmpm list --all
        name: "Test MMPM package download"
