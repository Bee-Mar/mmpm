<div class="editor-toolbar">
  <button class="btn primary" (click)="onSaveFile()" [disabled]="state[file].current === state[file].saved">
    <i class="fa-solid fa-floppy-disk"></i> Save
  </button>

  <div class="file-tabs">
    @for (f of fileNames; track f) {
      <button class="file-tab" [class.active]="file === f" (click)="onSelectFile(f)">
        <i class="fa-solid fa-file-code"></i>
        {{ f }}
        @if (state[f].current !== state[f].saved) {
          <span class="dirty-dot"></span>
        }
      </button>
    }
  </div>

  <div class="spacer"></div>

  <div class="font-size-ctrl">
    <span class="font-label">Size</span>
    <div class="segmented">
      <button [class.active]="fontSize === 12" (click)="fontSize = 12; onFontSizeChange()">12</button>
      <button [class.active]="fontSize === 14" (click)="fontSize = 14; onFontSizeChange()">14</button>
      <button [class.active]="fontSize === 16" (click)="fontSize = 16; onFontSizeChange()">16</button>
    </div>
  </div>
</div>

<div class="editor-wrap" (keydown)="handleKeyDown($event)" tabindex="0">
  <ngx-monaco-editor
    [options]="options"
    (onInit)="onEditorInit($event)"
    [(ngModel)]="state[file].current">
  </ngx-monaco-editor>
</div>

<p-toast></p-toast>
