<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>MagicMirror Package Manager</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="assets/MagicMirror-Package-Manager-Icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    #mmpm-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0b0b10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      transition: opacity 500ms ease;
    }

    #mmpm-splash.splash-out {
      opacity: 0;
      pointer-events: none;
    }

    .splash-logo {
      width: 420px;
      max-width: 80vw;
      opacity: 0;
      animation: splash-logo-in 600ms ease 100ms forwards;
    }

    @keyframes splash-logo-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .splash-dots {
      display: flex;
      gap: 8px;
      opacity: 0;
      animation: splash-logo-in 400ms ease 500ms forwards;
    }

    .splash-dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(200, 180, 100, 0.5);
      animation: splash-pulse 1.2s ease-in-out infinite;
    }

    .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
    .splash-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes splash-pulse {
      0%, 100% { opacity: 0.25; transform: scale(0.8); }
      50%       { opacity: 1;    transform: scale(1.2); }
    }
  </style>
</head>

<body>
  <div id="mmpm-splash">
    <img class="splash-logo" src="assets/MagicMirror-Package-Manager.png" alt="MagicMirror Package Manager" />
    <div class="splash-dots">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <app-root></app-root>
</body>

</html>
